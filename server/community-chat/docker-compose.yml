services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: echo_chat
      POSTGRES_USER: echo_chat
      POSTGRES_PASSWORD: echo_chat
    ports:
      - "54329:5432"
    volumes:
      - echo-chat-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

volumes:
  echo-chat-postgres:
