<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECHO Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        root.innerHTML = [
          '<main data-echo-startup-recovery="true" style="min-height:100vh;background:#020711;color:#e5eef7;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px;">',
          '<section style="max-width:720px;border:1px solid rgba(125,211,252,.25);background:rgba(15,23,42,.82);border-radius:16px;padding:28px;box-shadow:0 20px 80px rgba(0,0,0,.45);">',
          '<p style="margin:0 0 10px;color:#fbbf24;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">ECHO Launcher Startup Recovery</p>',
          '<h1 style="margin:0 0 14px;font-size:28px;line-height:1.2;">The launcher UI did not load.</h1>',
          '<p style="margin:0 0 18px;color:#cbd5e1;line-height:1.6;">The app opened, but the renderer bundle did not mount. This build now reports startup failures instead of leaving a black screen.</p>',
          '<p style="margin:0;color:#94a3b8;line-height:1.6;">Send the launcher log from <code style="color:#e0f2fe;">%APPDATA%\\echo-launcher\\ECHO\\launcher-logs</code> with this message.</p>',
          '</section>',
          '</main>',
        ].join('')
      }, 5000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
